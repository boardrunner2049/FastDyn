name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-docs-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/docs-assets.nix', 'docs/assets.toml') }}
          restore-prefixes-first-match: nix-docs-${{ runner.os }}-
          gc-max-store-size: 2G
      - name: Configure repository links
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          mkdir -p out
          nix develop .#docs --profile out/docs-env --command python utils/configure_pages.py \
            --repository "$REPOSITORY" --branch "$DEFAULT_BRANCH" --server-url "$SERVER_URL"
      - name: Build the book
        run: nix develop .#docs --command mdbook build docs
      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: documentation-preview
          path: out/docs
      - name: Package GitHub Pages site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/docs

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
