name: FastDyn CI

# Builds FastDyn the way the README does, runs the unit tests, the README's
# minimal example and the bundled FreeRTOS introspection smoke test.
# No board, network service or API key is needed.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out FastDyn
        uses: actions/checkout@v4

      - name: Install system packages (README, step 1)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git meson ninja-build pkg-config python3-venv \
            libglib2.0-dev libcjson-dev libpixman-1-dev libfdt-dev zlib1g-dev flex bison \
            gcc-arm-none-eabi binutils-arm-none-eabi nasm llvm-18 clang-18 lld

      - name: Set up and build (README, step 2)
        run: |
          source ./setup.sh --build-qemu \
            --qemu-targets arm-softmmu,aarch64-softmmu,x86_64-softmmu,riscv32-softmmu,riscv64-softmmu

      - name: Unit tests
        run: |
          source fastdyn-env/bin/activate
          python -m pytest -q tests/unit src/fastdyn/binary/tests/test_mmiofinder.py

      - name: Automatic MMIO baseline and optimized regressions
        env:
          FASTDYN_QEMU_BIN: ${{ github.workspace }}/third_party/common/qemu/build/qemu-system-arm
          FASTDYN_PLUGIN_LIB: ${{ github.workspace }}/build/libfastdyn.so
          FASTDYN_MMIO_ARTIFACTS: ${{ github.workspace }}/mmio-opt-artifacts
        run: tests/integration/run_fastdyn_mmio_opt.sh

      - name: Upload automatic MMIO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmio-opt-artifacts
          path: mmio-opt-artifacts
          if-no-files-found: warn

      - name: Minimal example (configs/minimal.toml)
        run: |
          set -o pipefail
          source fastdyn-env/bin/activate
          timeout 120 fastdyn -q run -c configs/minimal.toml | tee minimal.out
          grep -q '^Reg 0:0x00000003$' minimal.out
          grep -q '^\[BENCH\]\[minimal\] elapsed_ns=' minimal.out

      - name: Guest instruction fragment architecture matrix
        env:
          FASTDYN_QEMU_BUILD: ${{ github.workspace }}/third_party/common/qemu/build
        run: tests/integration/run_guest_code_fragments_smoke.sh

      - name: FastDyn public fragment API smoke
        env:
          FASTDYN_QEMU_ROOT: ${{ github.workspace }}/third_party/common/qemu
          FASTDYN_QEMU_BIN: ${{ github.workspace }}/third_party/common/qemu/build/qemu-system-arm
          FASTDYN_PLUGIN_LIB: ${{ github.workspace }}/build/libfastdyn.so
        run: tests/integration/run_fastdyn_guest_code_fragment_smoke.sh

      - name: Bundled FreeRTOS introspection smoke test
        env:
          FASTDYN_QEMU_BIN: ${{ github.workspace }}/third_party/common/qemu/build/qemu-system-arm
        run: tests/integration/run_bundled_freertos_introspection_smoke.sh
