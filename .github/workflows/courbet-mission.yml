name: Courbet Mission

# Manual only (Actions > Courbet Mission > Run workflow): the full ArduPilot
# simulation path is slow and needs Gazebo. FastDyn CI (ci.yml) runs on every
# push and pull request.
on:
  workflow_dispatch:

jobs:
  arducopter-mission:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Check out FastDyn
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            device-tree-compiler \
            git \
            libexpat1-dev \
            libfdt-dev \
            libglib2.0-dev \
            libprotobuf-dev \
            libpixman-1-dev \
            libssl-dev \
            meson \
            ninja-build \
            pkg-config \
            protobuf-compiler \
            python3-venv \
            zlib1g-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            third_party/common/rumoca/target
            virtuals/fuzzer/libafl_phi/target
            ../banquo/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('third_party/common/rumoca/Cargo.lock', 'virtuals/fuzzer/libafl_phi/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache patched QEMU checkout
        uses: actions/cache@v4
        with:
          path: ../qemu
          key: ${{ runner.os }}-qemu-fastdyn-${{ hashFiles('setup.sh', 'patches/qemu-fastdyn-plugin-icount.patch') }}
          restore-keys: |
            ${{ runner.os }}-qemu-fastdyn-

      - name: Set up FastDyn, Courbet, Rumoca, and patched QEMU
        env:
          FASTDYN_QEMU_REF: fastdyn
        run: |
          source ./setup.sh --build-qemu

      - name: Check OptiFuzz FMUv3 runner
        run: |
          source fastdyn-env/bin/activate
          cd virtuals/fuzzer/libafl_phi
          cargo check --bin baby_fuzzer
          run_optifuzz_smoke() {
            local vehicle="$1"
            local config="$2"
            local mission="$3"
            local base_port="$4"
            FASTDYN_OPTIFUZZ_SMOKE=1 \
              FASTDYN_OPTIFUZZ_DRY_RUN=1 \
              FASTDYN_OPTIFUZZ_VEHICLE="$vehicle" \
              FASTDYN_OPTIFUZZ_CONFIG="$config" \
              FASTDYN_OPTIFUZZ_MISSION_FILE="$mission" \
              FASTDYN_OPTIFUZZ_COVERAGE=1 \
              cargo run --bin baby_fuzzer
            FASTDYN_OPTIFUZZ_SMOKE=1 \
              FASTDYN_OPTIFUZZ_DRY_RUN=1 \
              FASTDYN_OPTIFUZZ_VEHICLE="$vehicle" \
              FASTDYN_OPTIFUZZ_CONFIG="$config" \
              FASTDYN_OPTIFUZZ_MISSION_FILE="$mission" \
              FASTDYN_OPTIFUZZ_SWARM_INSTANCES=2 \
              FASTDYN_OPTIFUZZ_BASE_PORT="$base_port" \
              cargo run --bin baby_fuzzer
          }
          run_optifuzz_smoke copter configs/copter462.toml virtuals/physics/flight_controllers/courbet/mavlink/copter_mission.waypoints 19200
          run_optifuzz_smoke rover configs/rover462.toml virtuals/physics/flight_controllers/courbet/mavlink/rover_rectangle.txt 19300
          run_optifuzz_smoke plane configs/plane462.toml virtuals/physics/flight_controllers/courbet/mavlink/plane_circle_point.txt 19400

      - name: Check parallel swarm port plans
        run: |
          source fastdyn-env/bin/activate
          fastdyn swarm -c configs/copter462.toml -n 2 -o out/ci/copter_swarm_plan --base-port 17000 --dry-run
          fastdyn swarm -c configs/rover462.toml -n 2 -o out/ci/rover_swarm_plan --base-port 17100 --dry-run
          fastdyn swarm -c configs/plane462.toml -n 2 -o out/ci/plane_swarm_plan --base-port 17200 --dry-run

      - name: Run two-worker swarm launch smoke tests
        run: |
          source fastdyn-env/bin/activate
          run_swarm_smoke() {
            local label="$1"
            local config="$2"
            local base_port="$3"
            local smoke_sec="$4"
            FASTDYN_SWARM_LABEL="$label" \
              FASTDYN_SWARM_CONFIG="$config" \
              FASTDYN_SWARM_INSTANCES=2 \
              FASTDYN_SWARM_BASE_PORT="$base_port" \
              FASTDYN_SWARM_SMOKE_SEC="$smoke_sec" \
              FASTDYN_SWARM_WORK_ROOT="out/ci/${label}_swarm" \
              tests/integration/courbet_swarm_smoke.sh
          }
          run_swarm_smoke arducopter configs/copter462.toml 18000 30
          run_swarm_smoke ardurover configs/rover462.toml 18100 5
          run_swarm_smoke arduplane configs/plane462.toml 18200 5

      - name: Run Rumoca FMI v3 ArduRover launch smoke test
        env:
          FASTDYN_COURBET_CONFIG: "configs/rover462.toml"
          FASTDYN_COURBET_LABEL: "ardurover"
          FASTDYN_COURBET_TIMEOUT_SEC: "240"
          FASTDYN_MONITOR_PORT: "19000"
          FASTDYN_MAVLINK_FIRMWARE_PORT: "19001"
          FASTDYN_MAVLINK_GCS_PORT: "19002"
          FASTDYN_MAVCESIUM_PORT: "19003"
          FASTDYN_QMP_SOCKET: "/tmp/fastdyn-ardurover-qmp.sock"
        run: |
          tests/integration/courbet_fmu_vehicle_smoke.sh

      - name: Run Rumoca FMI v3 ArduPlane launch smoke test
        env:
          FASTDYN_COURBET_CONFIG: "configs/plane462.toml"
          FASTDYN_COURBET_LABEL: "arduplane"
          FASTDYN_COURBET_TIMEOUT_SEC: "240"
          FASTDYN_MONITOR_PORT: "19100"
          FASTDYN_MAVLINK_FIRMWARE_PORT: "19101"
          FASTDYN_MAVLINK_GCS_PORT: "19102"
          FASTDYN_MAVCESIUM_PORT: "19103"
          FASTDYN_QMP_SOCKET: "/tmp/fastdyn-arduplane-qmp.sock"
        run: |
          tests/integration/courbet_fmu_vehicle_smoke.sh

      - name: Run Rumoca FMI v3 ArduCopter mission smoke test
        env:
          FASTDYN_COURBET_TIMEOUT_SEC: "420"
          FASTDYN_COURBET_MIN_ALT_M: "10.0"
          FASTDYN_COURBET_MIN_ITEM: "5"
          FASTDYN_COURBET_REQUIRE_COMPLETION: "true"
        run: |
          tests/integration/courbet_mission_smoke.sh

      - name: Upload mission log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courbet-mission-log
          path: |
            out/ci/courbet_mission.log
            out/ci/courbet_mission.log.phases
            out/ci/ardurover_fmu_smoke.log
            out/ci/arduplane_fmu_smoke.log
            out/ci/ardurover_work/**
            out/ci/arduplane_work/**
            out/ci/*_swarm/**
            fastdyn_work/fastdyn_timing.jsonl
            fastdyn_work/profiles/**
          if-no-files-found: ignore
