# Firmware-under-test definitions for the HALucinator-vs-HALucinator-FD macrobench.
#
# Two modes:
#   mode = "uart"    — peer sends scripted input via ZMQ; exits on `success`.
#   mode = "stdout"  — runner watches emulator stdout for `success`.
# `timeout` is the per-iteration limit in seconds (~3x the expected
# HALucinator time); past it the run is killed, logged and retried once.
#
# Paths are container-internal. Both the halucinator and halucinator-fd images
# expose the halucinator tree at /root/halucinator, so the same spec works
# for both backends.

# ---- STM32 --------------------------------------------------------------

# The screenshot case: UART Hyperterminal, IT-driven USART.
# Matches the firmware you demoed manually. Uses the example script
# referenced in HALucinator's top-level Docker README, which works in
# both the halucinator and halucinator-fd images.
# UART peripheral base = 0x40004400 = 1073811456.
[stm32_uart_it]
emu_cmd  = "./test/STM32/example/run.sh"
emu_cwd  = "/root/halucinator"
mode     = "uart"
uart_id  = 1073811456
timeout  = 60
success  = "Example Finished"
steps    = [
  { wait = "Enter 10 characters", send = "0123456789" },
]

# The heavier STM32469_EVAL variants (BB/Full/Halt × IT/DMA) are in
# test/STM32/STM32469_EVAL/UART/ but their shell scripts reference
# a non-existent test/results/ path and will need patching before use.
# Skip for now; the `stm32_uart_it` entry above covers the same firmware.

# ---- Zephyr RTOS --------------------------------------------------------

# All zephyr entries are invoked from /root/halucinator (not the test
# subdir). Turbo's FastDyn plugin path inside the configs is relative to
# repo root — cd'ing into the test dir breaks plugin load.
[zephyr_k64f]
emu_cmd  = "halucinator -c test/zephyr/frdm_k64f_UART_Excellent_Test/zephyr_memory.yaml -c test/zephyr/frdm_k64f_UART_Excellent_Test/frdm_k64f_boot.yaml -c test/zephyr/frdm_k64f_UART_Excellent_Test/uart_breakpoints.yaml -c test/zephyr/frdm_k64f_UART_Excellent_Test/zephyr_addrs.yaml --log_blocks=trace-nochain"
emu_cwd  = "/root/halucinator"
mode     = "uart"
uart_id  = 0
newline  = true
timeout  = 90
success  = "last char was: 0x65"
steps    = [
  { wait = "Enter a line", send = "test" },
  { wait = "last char was: 0x74", send = "another line" },
]

[zephyr_h103]
emu_cmd  = "halucinator -c test/zephyr/olimex_stm32_h103_UART_Excellent_test/zephyr_memory.yaml -c test/zephyr/olimex_stm32_h103_UART_Excellent_test/olimex_h103_boot.yaml -c test/zephyr/olimex_stm32_h103_UART_Excellent_test/uart_breakpoints.yaml -c test/zephyr/olimex_stm32_h103_UART_Excellent_test/zephyr_addrs.yaml --log_blocks=trace-nochain"
emu_cwd  = "/root/halucinator"
mode     = "uart"
uart_id  = 0
newline  = true
timeout  = 90
success  = "last char was: 0x65"
steps    = [
  { wait = "Enter a line", send = "test" },
  { wait = "last char was: 0x74", send = "another line" },
]

# Filesystem demo — no user input. Firmware prints "All tests complete."
# via UART, which goes out through halucinator's ZMQ publisher (not its
# process stdout), so we still need the UART peer — just with zero steps.
[zephyr_fs]
emu_cmd  = "halucinator -c test/zephyr/zephyr_fs/zephyr_memory.yaml -c test/zephyr/zephyr_fs/zephyr_config.yaml -c test/zephyr/zephyr_fs/zephyr_addrs.yaml --log_blocks=trace-nochain"
emu_cwd  = "/root/halucinator"
mode     = "uart"
uart_id  = 0
newline  = false
timeout  = 400
success  = "All tests complete."
steps    = []

# ---- SAMR21 -------------------------------------------------------------

# Byte-level UART echo. Firmware doesn't print a prompt — peer sends after
# any TX activity or a short warmup. (run.sh in the tree sources a
# virtualenv that doesn't exist in the current Docker image; call
# halucinator directly.)
[samr21_uart_echo]
emu_cmd  = "halucinator -c test/SAMR21/UART-Echo/Full_SAMR21_config.yaml -c test/SAMR21/UART-Echo/Memories_Release_USART.yaml -c test/SAMR21/UART-Echo/Release_USART_QUICK_START1_addrs.yaml --log_blocks -n samr21_uart_echo"
emu_cwd  = "/root/halucinator"
mode     = "uart"
uart_id  = 0
timeout  = 60
success  = "0123456789abcdefghij"
steps    = [
  { wait = "", send = "0123456789abcdefghij" },
]

# Block I/O test on SD-over-SPI. No user input. Like zephyr_fs, firmware
# output is ZMQ-only, so uart mode with no steps. Marker TBD after one
# untimed run — placeholder below.
[samr21_sdmmc]
emu_cmd  = "./test/SAMR21/SD_MMC/Full_run_release.sh"
emu_cwd  = "/root/halucinator"
mode     = "uart"
uart_id  = 0
newline  = false
timeout  = 600
success  = "Test end"
steps    = []
