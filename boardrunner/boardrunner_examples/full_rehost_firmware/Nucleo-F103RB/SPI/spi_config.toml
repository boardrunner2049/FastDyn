[Memory]

[Memory.main]
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

[Machine]
platform = "STM32F103xx"
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=true
finline='None'

[CPU]
[[CPU.cpu0]]
arch = "arm"
machine = "cortexm"
cpu = "cortex-m3"
plugin_library = "build/libfastdyn.so"
binary = "boardrunner/boardrunner_examples/full_rehost_firmware/Nucleo-F103RB/SPI/firmwares/STM32F103RB_Nucleo.elf"
init_nsvtor = "0x08000000"
twintrace = "None"
hardware_trace = 'hardware_log/io.log'

logger_content = """
# level = DEBUG
# output = stderr
"""

[Device.Models.elder]

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]

[Device.Models.twintrace]
    backend = "stlink"

[Device.Models.unhandled]

# ------------------------------------------------------------------------------
# Fully rehosted: every peripheral the firmware touches has an elder model.
# NVIC / SCB / SysTick (0xE000xxxx) are served by QEMU's Cortex-M core.
#
# Hardware trace capture: every passthrough handler enabled = true, every elder
# handler enabled = false, remaining_space passthrough enabled = true.
# Rehosted run: elder on, passthrough off, remaining_space off.
# ------------------------------------------------------------------------------

[Device.flash]
    ranges = [["0x40022000", "0x400223FF"]]
    # Passthrough registers IRQs from the FIRST device block only (alphabetical),
    # passthrough.c:83-95. Keep the IRQ list on the first block.
    irq = [[1, 100]]
    description = "FLASH interface (ACR latency / prefetch)"
    read_priority = "elder"
    [[Device.flash.handlers]]
        model   = "elder"
        enabled = true
        scroll  = "boardrunner/boardrunner_sdk/build/flash_model.so"
    [[Device.flash.handlers]]
        model   = "passthrough"
        enabled = false

[Device.gpioa]
    ranges = [["0x40010800", "0x40010BFF"]]
    description = "GPIOA (LD2 on PA5)"
    read_priority = "elder"
    [[Device.gpioa.handlers]]
        model   = "elder"
        enabled = true
        scroll  = "boardrunner/boardrunner_sdk/build/gpioa_model.so"
    [[Device.gpioa.handlers]]
        model   = "passthrough"
        enabled = false

[Device.rcc]
    # RCC + its bit-band alias (HAL sets PLLON through 0x42420060)
    ranges = [["0x40021000", "0x400213FF"], ["0x42420000", "0x42427FFF"]]
    description = "Reset and Clock Control"
    read_priority = "elder"
    [[Device.rcc.handlers]]
        model   = "elder"
        enabled = true
        scroll  = "boardrunner/boardrunner_sdk/build/rcc_model.so"
    [[Device.rcc.handlers]]
        model   = "passthrough"
        enabled = false

[Device.spi2]
    # SPI2 registers + GPIOB: PB12 is the BME280 chip select, PB13/14/15 the bus
    ranges = [["0x40003800", "0x40003BFF"], ["0x40010C00", "0x40010FFF"]]
    description = "SPI2 master (8-bit, software NSS) with CS on PB12"
    read_priority = "elder"
    [[Device.spi2.handlers]]
        model   = "elder"
        enabled = true
        scroll  = "boardrunner/boardrunner_sdk/build/spi2_model.so"
        [[Device.spi2.slaves]]
            model         = ["elder"]
            device        = "bme280"
            cs_id         = 0
            device_scroll = "boardrunner/boardrunner_sdk/build/bme280_slave.so"
    [[Device.spi2.handlers]]
        model   = "passthrough"
        enabled = false

[Device.remaining_space]
    # Trace capture only. Keep disabled for the rehosted run.
    ranges = [
        ["0x40000000", "0x400037FF"],
        ["0x40003C00", "0x400107FF"],
        ["0xE0000000", "0xEFFFFFFF"]
    ]
    irq = [[1, 100]]
    description = "Everything else -> real hardware during trace capture"
    [[Device.remaining_space.handlers]]
        model   = "passthrough"
        enabled = false
