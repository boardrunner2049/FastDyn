[Memory]

[Memory.main]
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

[Machine]
platform = "STM32F103xx"
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=true
finline='None'

[CPU]
[[CPU.cpu0]]
arch = "arm"
machine = "cortexm"
cpu = "cortex-m3"
plugin_library = "build/libfastdyn.so"
binary = "boardrunner/boardrunner_examples/full_rehost_firmware/Nucleo-F103RB/GPIO_with_GPIO_INT/firmwares/STM32F103RB_Nucleo.elf"
init_nsvtor = "0x08000000"
twintrace = "None"
hardware_trace = 'hardware_log/io.log'

logger_content = """
# level = DEBUG
# output = stderr
"""

[Device.Models.elder]

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]

[Device.Models.twintrace]
    backend = "stlink"

[Device.Models.unhandled]

# ------------------------------------------------------------------------------
# Fully rehosted: every peripheral the firmware touches has an elder model.
# NVIC / SCB / SysTick (0xE000xxxx) are served by QEMU's Cortex-M core.
#
# Hardware trace capture: every passthrough handler enabled = true, every elder
# handler enabled = false, remaining_space passthrough enabled = true.
# Rehosted run: elder on, passthrough off, remaining_space off.
# ------------------------------------------------------------------------------

[Device.rcc]
    # RCC + its bit-band alias (HAL sets PLLON through 0x42420060)
    ranges = [["0x40021000", "0x400213FF"], ["0x42420000", "0x42427FFF"]]
    description = "Reset and Clock Control"
    read_priority = "elder"
    [[Device.rcc.handlers]]
        model   = "elder"
        enabled = false
        scroll  = "boardrunner/boardrunner_sdk/build/rcc_model.so"
    [[Device.rcc.handlers]]
        model   = "passthrough"
        enabled = true

[Device.flash]
    ranges = [["0x40022000", "0x400223FF"]]
    description = "FLASH interface (ACR latency / prefetch)"
    read_priority = "elder"
    [[Device.flash.handlers]]
        model   = "elder"
        enabled = false
        scroll  = "boardrunner/boardrunner_sdk/build/flash_model.so"
    [[Device.flash.handlers]]
        model   = "passthrough"
        enabled = true

[Device.afio]
    ranges = [["0x40010000", "0x400103FF"]]
    # Passthrough registers IRQs from the FIRST device block only (alphabetical
    # -> afio), passthrough.c:83-95. Keep the IRQ list here or hardware IRQs are
    # never served and the board stays halted after the first interrupt.
    irq = [[1, 100]]
    description = "AFIO (EXTICR: EXTI line 13 -> port C)"
    read_priority = "elder"
    [[Device.afio.handlers]]
        model   = "elder"
        enabled = false
        scroll  = "boardrunner/boardrunner_sdk/build/afio_model.so"
    [[Device.afio.handlers]]
        model   = "passthrough"
        enabled = true

[Device.exti]
    ranges = [["0x40010400", "0x400107FF"]]
    irq = [[1, 100]]
    description = "EXTI (line 13 -> IRQ 40 / EXTI15_10)"
    read_priority = "elder"
    [[Device.exti.handlers]]
        model   = "elder"
        enabled = false
        scroll  = "boardrunner/boardrunner_sdk/build/exti_model.so"
    [[Device.exti.handlers]]
        model   = "passthrough"
        enabled = true

[Device.gpioa]
    ranges = [["0x40010800", "0x40010BFF"]]
    description = "GPIOA (LD2 on PA5)"
    read_priority = "elder"
    [[Device.gpioa.handlers]]
        model   = "elder"
        enabled = false
        scroll  = "boardrunner/boardrunner_sdk/build/gpioa_model.so"
    [[Device.gpioa.handlers]]
        model   = "passthrough"
        enabled = true

[Device.gpioc]
    ranges = [["0x40011000", "0x400113FF"]]
    description = "GPIOC (user button on PC13, publishes signal 13)"
    read_priority = "elder"
    [[Device.gpioc.handlers]]
        model   = "elder"
        enabled = false
        scroll  = "boardrunner/boardrunner_sdk/build/gpioc_model.so"
    [[Device.gpioc.handlers]]
        model   = "passthrough"
        enabled = true

[Device.remaining_space]
    # Trace capture only. Keep disabled for the rehosted run.
    # Passthrough holds at most 10 ranges in total (passthrough.c: Range ranges[10]),
    # so this block stays at 3.
    ranges = [
        ["0x40000000", "0x4000FFFF"],
        ["0x40011400", "0x40020FFF"],
        ["0xE0000000", "0xEFFFFFFF"]
    ]
    irq = [[1, 100]]
    description = "Everything else -> real hardware during trace capture"
    [[Device.remaining_space.handlers]]
        model   = "passthrough"
        enabled = true
