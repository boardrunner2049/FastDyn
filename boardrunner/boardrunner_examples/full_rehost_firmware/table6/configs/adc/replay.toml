[Memory]

[Memory.main]
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

[Machine]
platform = "STM32F103xx"
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=true
finline='None'

[CPU]
[[CPU.cpu0]]
arch = "arm"
machine = "cortexm"
cpu = "cortex-m3"
plugin_library = "build/libfastdyn.so"
binary = "boardrunner/boardrunner_examples/full_rehost_firmware/Nucleo-F103RB/ADC_with_DMA/firmwares/STM32F103RB_Nucleo.elf"
init_nsvtor = "0x08000000"
twintrace = "replay"
hardware_trace = 'boardrunner/boardrunner_examples/full_rehost_firmware/table6/tapes/adc/record.trace'

logger_content = """
# level = DEBUG
# output = stderr
"""

[Device.Models.elder]

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]

[Device.Models.twintrace]
    backend = "stlink"

[Device.Models.unhandled]

# ------------------------------------------------------------------------------
# Fully rehosted: every peripheral the firmware touches has an elder model.
# NVIC / SCB / SysTick (0xE000xxxx) are served by QEMU's Cortex-M core.
#
# Hardware trace capture: every passthrough handler enabled = true, every elder
# handler enabled = false, remaining_space passthrough enabled = true.
# Rehosted run: elder on, passthrough off, remaining_space off.
# ------------------------------------------------------------------------------

[Device.adc1]
    ranges = [["0x40012400", "0x400127FF"]]
    # Passthrough registers IRQs from the FIRST device block only (alphabetical),
    # passthrough.c:83-95. Keep the IRQ list on the first block.
    irq = [[1, 100]]
    description = "ADC1 (continuous conversion, DMA request source)"
    read_priority = "elder"
    [[Device.adc1.handlers]]
        model   = "twintrace"
        enabled = true
    [[Device.adc1.handlers]]
        model   = "passthrough"
        enabled = false

[Device.dma1]
    ranges = [["0x40020000", "0x400203FF"]]
    irq = [[1, 100]]
    description = "DMA1 (channel 1 <- ADC1, transfer-complete IRQ 11)"
    read_priority = "elder"
    [[Device.dma1.handlers]]
        model   = "twintrace"
        enabled = true
    [[Device.dma1.handlers]]
        model   = "passthrough"
        enabled = false

[Device.rcc]
    # RCC + its bit-band alias (HAL sets PLLON through 0x42420060)
    ranges = [["0x40021000", "0x400213FF"], ["0x42420000", "0x42427FFF"]]
    description = "Reset and Clock Control"
    read_priority = "elder"
    [[Device.rcc.handlers]]
        model   = "twintrace"
        enabled = true
    [[Device.rcc.handlers]]
        model   = "passthrough"
        enabled = false

[Device.flash]
    ranges = [["0x40022000", "0x400223FF"]]
    description = "FLASH interface (ACR latency / prefetch)"
    read_priority = "elder"
    [[Device.flash.handlers]]
        model   = "twintrace"
        enabled = true
    [[Device.flash.handlers]]
        model   = "passthrough"
        enabled = false

[Device.gpioa]
    ranges = [["0x40010800", "0x40010BFF"]]
    description = "GPIOA (LD2 on PA5)"
    read_priority = "elder"
    [[Device.gpioa.handlers]]
        model   = "twintrace"
        enabled = true
    [[Device.gpioa.handlers]]
        model   = "passthrough"
        enabled = false

[Device.remaining_space]
    # Trace capture only. Keep disabled for the rehosted run.
    ranges = [
        ["0x40000000", "0x400107FF"],
        ["0x40010C00", "0x400123FF"],
        ["0xE0000000", "0xEFFFFFFF"]
    ]
    irq = [[1, 100]]
    description = "Everything else -> real hardware during trace capture"
    [[Device.remaining_space.handlers]]
        model   = "twintrace"
        enabled = true
