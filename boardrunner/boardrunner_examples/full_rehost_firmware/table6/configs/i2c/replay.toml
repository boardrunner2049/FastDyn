[Memory]

[Memory.main]
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "/dev/shm/my_m4_ram"
share        = true
prealloc     = false

[Machine]
platform = "STM32F103xx"
qemu_path = "qemu-system-arm"
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=true
finline='None'

[CPU]
[[CPU.cpu0]]
arch = "arm"
machine = "cortexm"
cpu = "cortex-m3"
plugin_library = "build/libfastdyn.so"
binary = "boardrunner/boardrunner_examples/full_rehost_firmware/Nucleo-F103RB/I2C/firmwares/STM32F103RB_Nucleo.elf"
init_nsvtor = "0x08000000"
twintrace = "replay"
hardware_trace = 'boardrunner/boardrunner_examples/full_rehost_firmware/table6/tapes/i2c/record.trace'

logger_content = """
# level = DEBUG
# output = stderr
"""

[Device.Models.elder]

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]

[Device.Models.twintrace]
    backend = "stlink"

[Device.Models.unhandled]

# ------------------------------------------------------------------------------
# Fully rehosted: every peripheral the firmware touches has an elder model.
# NVIC / SCB / SysTick (0xE000xxxx) are served by QEMU's Cortex-M core.
#
# Hardware trace capture: every passthrough handler enabled = true, every elder
# handler enabled = false, remaining_space passthrough enabled = true.
# Rehosted run: elder on, passthrough off, remaining_space off.
# ------------------------------------------------------------------------------

[Device.afio]
    ranges = [["0x40010000", "0x400103FF"]]
    # Passthrough registers IRQs from the FIRST device block only (alphabetical),
    # passthrough.c:83-95. Keep the IRQ list on the first block.
    irq = [[1, 100]]
    description = "AFIO (MAPR: I2C1 remap to PB8/PB9)"
    read_priority = "elder"
    [[Device.afio.handlers]]
        model   = "twintrace"
        enabled = true
    [[Device.afio.handlers]]
        model   = "passthrough"
        enabled = false

[Device.flash]
    ranges = [["0x40022000", "0x400223FF"]]
    description = "FLASH interface (ACR latency / prefetch)"
    read_priority = "elder"
    [[Device.flash.handlers]]
        model   = "twintrace"
        enabled = true
    [[Device.flash.handlers]]
        model   = "passthrough"
        enabled = false

[Device.gpioa]
    ranges = [["0x40010800", "0x40010BFF"]]
    description = "GPIOA (LD2 on PA5)"
    read_priority = "elder"
    [[Device.gpioa.handlers]]
        model   = "twintrace"
        enabled = true
    [[Device.gpioa.handlers]]
        model   = "passthrough"
        enabled = false

[Device.gpiob]
    ranges = [["0x40010C00", "0x40010FFF"]]
    description = "GPIOB (PB8 SCL / PB9 SDA: bus-recovery bit-bang, then AF open-drain)"
    read_priority = "elder"
    [[Device.gpiob.handlers]]
        model   = "twintrace"
        enabled = true
    [[Device.gpiob.handlers]]
        model   = "passthrough"
        enabled = false

[Device.i2c1]
    ranges = [["0x40005400", "0x400057FF"]]
    description = "I2C1 master, 100 kHz, BME280 at 0x76"
    read_priority = "elder"
    [[Device.i2c1.handlers]]
        model   = "twintrace"
        enabled = true
        [[Device.i2c1.slaves]]
            model         = ["elder"]
            device        = "bme280"
            address       = "0x76"
            device_scroll = "boardrunner/boardrunner_sdk/build/bme280_i2c_slave.so"
    [[Device.i2c1.handlers]]
        model   = "passthrough"
        enabled = false

[Device.rcc]
    # RCC + its bit-band alias (HAL sets PLLON through 0x42420060)
    ranges = [["0x40021000", "0x400213FF"], ["0x42420000", "0x42427FFF"]]
    description = "Reset and Clock Control"
    read_priority = "elder"
    [[Device.rcc.handlers]]
        model   = "twintrace"
        enabled = true
    [[Device.rcc.handlers]]
        model   = "passthrough"
        enabled = false

[Device.remaining_space]
    # Trace capture only. Keep disabled for the rehosted run.
    # Passthrough holds at most 10 ranges in total (passthrough.c: Range ranges[10]).
    ranges = [
        ["0x40000000", "0x400053FF"],
        ["0x40005800", "0x4000FFFF"],
        ["0xE0000000", "0xEFFFFFFF"]
    ]
    irq = [[1, 100]]
    description = "Everything else -> real hardware during trace capture"
    [[Device.remaining_space.handlers]]
        model   = "twintrace"
        enabled = true
