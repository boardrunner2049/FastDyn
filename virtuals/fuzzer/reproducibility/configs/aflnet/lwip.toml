# ==============================================================================
# Machine (machine-wide + QEMU target options)
# ==============================================================================
[Machine]
platform = "STM32F429"

qemu_path = "qemu-system-arm"

monitor_port = 5555
qmp_socket   = "/tmp/qmp.sock"

enable_gdb    = true
stop_on_start = false
launch_gdb    = false

semihosting        = true
semihosting_config = "enable=on,target=native"

coverage = true
fuzzing = true
# AFLNet uses raw Ethernet frames; schema injection is intentionally disabled.
# fuzzing_schema = "lwip_schema.json"
finline  = ""

# ==============================================================================
# Memory
# ==============================================================================
[Memory]

  # ---------------------------------------------------------------------------
  # Main memory (required)
  #
  # Used by:  -machine <...>,memory-backend=<id>
  # Also maps: ram_baseaddr0 / ram_backend0
  # ---------------------------------------------------------------------------
  [Memory.main]
  id           = "ram0"
  base_address = "0x20000000"
  memory_size  = "512M"
  memory_type  = "SRAM"

  backend     = "file"                 # file | ram | memfd
  memory_file = "/dev/shm/my_m4_ram3"  # only when backend="file"

  share    = true
  prealloc = false


  # ---------------------------------------------------------------------------
  # Extra memory banks (optional)
  #
  # Each bank becomes:
  #   -object memory-backend-*
  #   -global <machine>-soc.ram_baseaddrN=<base_address>
  #   -global <machine>-soc.ram_backendN=<id>
  # ---------------------------------------------------------------------------
  [[Memory.ram1]]
  id           = "ram1"
  index        = 1
  base_address = "0x30000000"
  memory_size  = "512K"
  memory_type  = "SRAM"

  backend     = "file"
  memory_file = "/dev/shm/my_m4_ram"

  share    = true
  prealloc = false

# ==============================================================================
# CPUs
# ==============================================================================
[CPU]

  # ---------------------------------------------------------------------------
  # CPU 0
  # ---------------------------------------------------------------------------
  [[CPU.cpu0]]
  arch    = "arm"
  machine = "cortexm"
  cpu     = "cortex-m7"

  binary     = "boardrunner/boardrunner_examples/examples/STM32F769i-eval/LWIP/firmwares/STM32F769I_EVAL.elf" ##
  init_nsvtor = "0x08000000"

  map_file        = "courbet/rover_v422_map.txt"
  plugin_library = "build-aflnet/libfastdyn.so"
  monitor_elf     = "../ws/monitor.elf"

  log_file    = "qemu.log"
  log_options = "none"

  twintrace = "None" #options are record, replay or None
  hardware_trace = 'hardware_log/io.log'   #useful in cases like replay to generate the replay binary

  logger_content = """
  # --- Plugin Logger Configuration ---
  # level  = DEBUG
  # output = stderr
  """

  # AFLNet flow: one raw Ethernet frame per request; a testcase is a frame sequence.
  [[CPU.cpu0.virtuals]]
  at = "0x0800087e"
  instruction = "fuzz_snap_point"
  args = ["aflnet-flow"]

  [[CPU.cpu0.virtuals]]
  at = "0x08000fc4"
  instruction = "fuzz_sync_point"
  args = ["aflnet-flow"]

  # The hardware SysTick peripheral is not part of this modeled boundary.
  # Advance the genuine HAL tick after the fuzz snapshot, so
  # sys_check_timeouts reaches lwIP's normal fast/slow timer paths between
  # AFLNet messages. FASTDYN_FUZZ_TIME_STEP_MS controls the 1000 ms default.
  [[CPU.cpu0.virtuals]]
  at = "0x08001684"
  instruction = "fuzz_advance_time"
  args = ["aflnet-clock"]


  # AFLNet owns snapshotting and delivers frames through the modeled MAC/DMA.
  # Execute Ethernet MAC, PHY, descriptor, and link-state code against the
  # modeled MAC/DMA/PHY below.  RCC completion is the only missing hardware
  # dependency, so its blocking HAL calls are the boundary shims.
  [[CPU.cpu0.modifiers]]
  at = "0x800285c"
  patch = "r0 0"

  [[CPU.cpu0.modifiers]]
  at = "0x800285c"
  patch = "r15 r14"

  [[CPU.cpu0.modifiers]]
  at = "0x80027ec"
  patch = "r0 0"

  [[CPU.cpu0.modifiers]]
  at = "0x80027ec"
  patch = "r15 r14"

  [[CPU.cpu0.modifiers]]
  at = "0x8002c40"
  patch = "r0 0"

  [[CPU.cpu0.modifiers]]
  at = "0x8002c40"
  patch = "r15 r14"

  # Keep the server initial sequence number deterministic so the schema's
  # valid ACK and HTTP request form one repeatable TCP conversation.
  [[CPU.cpu0.modifiers]]
  at = "0x8006060"
  patch = "r0 1234"


