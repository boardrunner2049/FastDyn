# For file format and explaination see
# https://docs.python.org/3/library/logging.config.html#logging-config-fileformat
[loggers]
keys=root,fastdyn.main,fastdyn.runner,FASTDYN_LOG

[handlers]
keys=consoleHandler

[formatters]
keys=sampleFormatter

[logger_root]
level=ERROR
handlers=consoleHandler

[logger_fastdyn.main]
level=INFO
handlers=consoleHandler
propagate=0
qualname=fastdyn.main

[logger_fastdyn.runner]
level=INFO
handlers=consoleHandler
propagate=0
qualname=fastdyn.runner

[logger_FASTDYN_LOG]
level=INFO
handlers=consoleHandler
propagate=0
qualname=FASTDYN_LOG

[logger_fastdyn]
level=DEBUG
handlers=consoleHandler
propagate=0
qualname=fastdyn

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=sampleFormatter
args=(sys.stdout,)

[formatter_sampleFormatter]
format=%(name)s|%(levelname)s|  %(message)s