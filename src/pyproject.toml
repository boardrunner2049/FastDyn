[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fastdyn"
dynamic = ["version"]
description = "FastDyn: QEMU-based firmware emulation and dynamic analysis engine"
authors = [{ name = "Fastdyn Team", email = "fastdyn@pseclab.com" }]
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# Runtime dependencies are installed from requirements.txt at the
# repository root.

[project.scripts]
fastdyn = "fastdyn.main:cli"

[tool.setuptools.dynamic]
version = { attr = "fastdyn.__version__" }

[tool.setuptools.packages.find]
include = ["fastdyn*"]
