[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fastdyn"
dynamic = ["version"]
description = "FastDyn: QEMU-based firmware emulation and dynamic analysis engine"
authors = [{ name = "Fastdyn Team", email = "fastdyn@pseclab.com" }]
requires-python = ">=3.10"
# Runtime dependencies are still installed from requirements.txt at the
# repository root, which currently also lists tool-specific packages.

[project.scripts]
fastdyn = "fastdyn.main:cli"
# Temporary alias, removed when BoardRunner ships its own command.
boardrunner = "fastdyn.main:cli"

[tool.setuptools.dynamic]
version = { attr = "fastdyn.__version__" }

[tool.setuptools.packages.find]
include = ["fastdyn*"]
