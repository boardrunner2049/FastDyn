# Educational plugin example: count every executable function entry in the
# bundled Zephyr fixture. Stop FastDyn with Ctrl-C to write counts.tsv.
[Machine]
platform = "generic-cortexm"
# qemu_path = "../qemu/build/qemu-system-arm"  # optional: defaults to the QEMU FastDyn was built against
display = "none"
serial = "none"
monitor_port = 0
qmp_socket = "/tmp/fastdyn-function-counter.qmp"
log_options = "none"
reset_memory_files = true

[Device]
[Device.Models]

[Memory.main]
id = "ram0"
base_address = "0x20000000"
memory_size = "8M"
memory_type = "SRAM"
backend = "file"
memory_file = "/tmp/fastdyn-function-counter.ram"
share = true

[CPU]
[[CPU.cpu0]]
arch = "arm"
machine = "lm3s6965evb"
cpu = "cortex-m3"
binary = "tests/binaries/rtos/zephyr.elf"
plugin_library = "build/libfastdyn.so"
init_nsvtor = "0x0"

[CPU.cpu0.plugins.function_counter]
enabled = true
