# Runnable RTOS introspection demo.
#
# From the FastDyn repository root:
#   fastdyn run -c configs/introspection/freertos.toml \
#       -o fastdyn-introspection-demo
#
# The introspection plugin starts the browser monitor from its TOML block.
# Stop QEMU with Ctrl-C when finished.

[Machine]
platform = "generic-cortexm"
# qemu_path = "../qemu/build/qemu-system-arm"  # optional: defaults to the QEMU FastDyn was built against
display = "none"
serial = "none"
monitor_port = 0
qmp_socket = "/tmp/fastdyn-introspection-demo.qmp"
log_options = "none"
reset_memory_files = true

[Device]
[Device.Models]

[Memory.main]
id = "ram0"
base_address = "0x20000000"
memory_size = "8M"
memory_type = "SRAM"
backend = "file"
memory_file = "/tmp/fastdyn-introspection-demo.ram"
share = true

[CPU]
[[CPU.cpu0]]
arch = "arm"
machine = "cortexm"
cpu = "cortex-m3"
binary = "tests/sample_binaries/RTOS/RTOSDemo.axf"
plugin_library = "build/libfastdyn.so"
init_nsvtor = "0x08000000"

[CPU.cpu0.plugins.introspection]
enabled = true

[CPU.cpu0.plugins.introspection.activity_monitor]
enabled = true
host = "127.0.0.1"
port = 8765
open_browser = true
