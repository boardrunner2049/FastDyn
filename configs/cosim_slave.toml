# ============================================================================
# FastDyn as a co-simulation slave.
#
# The guest starts paused and executes only the virtual time an external
# master grants over QMP. See docs/CoSimulationSlave.md.
#
#   Terminal 1:  fastdyn run -c configs/cosim_slave.toml -o fastdyn_work_cosim
#   Terminal 2:  utils/fastdyn_cosim.py /tmp/fastdyn-cosim.qmp --slice-ms 20 --slices 6
#
# The firmware is the world_model RLC/GPIO demo, so the master is also driving
# an FMI 3 physics model that advances in lockstep with the guest.
# ============================================================================

[Machine]
platform = "generic-cortexm"
# qemu_path = "qemu/build/qemu-system-arm"  # optional: defaults to the QEMU FastDyn was built against
display = "none"
monitor_port = 0
# The master drives the guest through this socket.
qmp_socket = "/tmp/fastdyn-cosim.qmp"
# Start paused: the guest executes nothing until the master grants budget.
stop_on_start = true
log_options = "none"
reset_memory_files = true
semihosting = true
semihosting_config = "enable=on,target=native"
# Budget deadlines are virtual-time deadlines. icount makes virtual time a
# deterministic function of instructions retired, so identical slice sequences
# reproduce identical guest execution.
icount = { shift = 5, sleep = false, align = false }
# Halt exactly on each granted deadline instead of at the first translation
# block boundary after it. Off by default; costs a synchronous vCPU pause per
# slice and removes the ~150 us overshoot entirely.
exact_budget_stop = true

[Device]
[Device.Models]

[Memory.main]
id = "ram0"
base_address = "0x20000000"
memory_size = "8M"
memory_type = "SRAM"
backend = "file"
memory_file = "/tmp/fastdyn-cosim.ram"
share = true

[CPU]
[[CPU.cpu0]]
arch = "arm"
machine = "cortexm"
cpu = "cortex-m3"
binary = "tests/binaries/world_rlc_gpio/world_rlc_gpio.elf"
plugin_library = "build/libfastdyn.so"
init_nsvtor = "0x08000000"

[CPU.cpu0.plugins.world]
enabled = true
step_ns = 100000

[CPU.cpu0.plugins.world.models.rlc]
path = "tools/world/examples/rlc/out/RLC.fmu"

[CPU.cpu0.plugins.world.endpoints]
supply = { target = "rlc.voltage", direction = "in" }
vcap = { target = "rlc.output_voltage", direction = "out" }

[[CPU.cpu0.plugins.world.pins]]
at = "world_gpio_write"
kind = "digital_out"
endpoint = "supply"
register = "r0"
low = 0.0
high = 3.3

[[CPU.cpu0.plugins.world.pins]]
at = "world_adc_read"
kind = "analog_in"
endpoint = "vcap"
register = "r0"
scale = 1000.0
