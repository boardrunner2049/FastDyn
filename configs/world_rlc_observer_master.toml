# ============================================================================
# world_model demo with the web observer, FastDyn owning its own clock.
#
# Identical to configs/world_rlc_gpio.toml, plus world_model's read-only
# observer. Here physics advances on access -- whenever the firmware touches a
# world-backed pin -- so nothing external paces the run.
#
# The firmware toggles its pin continuously and never exits, so the RLC keeps
# charging and discharging and the plots keep extending. Open the printed URL
# and watch; stop the run with Ctrl-C when you are done.
#
# For a step-by-step view where you control how far time advances, use
# configs/world_rlc_observer_slave.toml instead.
#
#   fastdyn run -c configs/world_rlc_observer_master.toml -o fastdyn_work_observer
#
# Prerequisites (see docs/WorldPlugin.md):
#   cmake -S tools/world -B tools/world/build -DWM_BUILD_TESTS=ON
#   cmake --build tools/world/build --target rlc_fmu
#   tests/firmwares/world_rlc_gpio/build.sh
#   make WORLD=true qemu_path=<path/to/qemu>
#
# This one file describes the machine and the physical world it is wired to.
# ============================================================================

[Machine]
platform = "generic-cortexm"
# qemu_path = "qemu/build/qemu-system-arm"  # optional: defaults to the QEMU FastDyn was built against
display = "none"
monitor_port = 0
qmp_socket = "/tmp/fastdyn-observer-master.qmp"
log_options = "none"
reset_memory_files = true
semihosting = true
semihosting_config = "enable=on,target=native"
# Instruction-counted virtual time: guest nanoseconds become a deterministic
# function of instructions retired, so the world advances reproducibly.
# align/sleep throttle the guest to the wall clock, which matters because the
# firmware now runs continuously: unpaced it would emit thousands of samples a
# second. Slave configurations leave these false, because there the master sets
# the pace.
icount = { shift = 5, sleep = true, align = true }

[Device]
[Device.Models]

[Memory.main]
id = "ram0"
base_address = "0x20000000"
memory_size = "8M"
memory_type = "SRAM"
backend = "file"
memory_file = "/tmp/fastdyn-observer-master.ram"
share = true

[CPU]
[[CPU.cpu0]]
arch = "arm"
machine = "cortexm"
cpu = "cortex-m3"
binary = "tests/binaries/world_rlc_gpio/world_rlc_gpio.elf"
plugin_library = "build/libfastdyn.so"
init_nsvtor = "0x08000000"

# ---------------------------------------------------------------------------
# The physical world.
# ---------------------------------------------------------------------------

[CPU.cpu0.plugins.world]
enabled = true
# Co-simulation quantum. The RLC's dominant time constant is about 8.9 ms,
# so 100 us resolves the transient comfortably.
# The observer plots the last 5000 trace samples, and world_model traces every
# communication step with no decimation, so the visible span is
# 5000 * step_ns -- 5 s here, against 0.5 s at a 100 us step. Anything up to
# 1 ms is numerically identical for this circuit (see docs/WorldPlugin.md), so
# this buys a 10x wider view for free.
step_ns = 1000000

[CPU.cpu0.plugins.world.models.rlc]
path = "tools/world/examples/rlc/out/RLC.fmu"

[CPU.cpu0.plugins.world.models.rlc.parameters]
resistance = 10.0
inductance = 0.01
capacitance = 0.001

# Stable names for the world variables this run cares about.
[CPU.cpu0.plugins.world.endpoints]
supply = { target = "rlc.voltage", direction = "in" }
vcap = { target = "rlc.output_voltage", direction = "out" }
current = { target = "rlc.current", direction = "out" }

[CPU.cpu0.plugins.world.trace]
output = "rlc_trace.csv"
# The observer plots exactly these series, each in a stable colour.
variables = ["rlc.voltage", "rlc.output_voltage", "rlc.current"]

# ---------------------------------------------------------------------------
# world_model's read-only web observer.
#
# FastDyn derives a world TOML from the tables above, runs world_model's own
# generator to produce the observer's metadata, and serves it. The observer
# only reads artifacts: it plots the trace and cannot steer the world.
# ---------------------------------------------------------------------------
[CPU.cpu0.plugins.world.observer]
enabled = true
host = "127.0.0.1"
port = 8770
open_browser = false
# Initial x-axis extent of the plots, in nanoseconds. Match it to the visible
# span (5000 * step_ns) so the axis lines up with the data at startup.
#
# The axis does not follow the data afterwards: world_model's page caches the
# x range on the first draw and only ever widens y, and its "Reset view" clears
# a manual zoom but not that cached range. Once the run passes this horizon,
# pan or zoom with the mouse to look at later data.
horizon_ns = 5_000_000_000

# ---------------------------------------------------------------------------
# Where the firmware meets the world.
# ---------------------------------------------------------------------------

# The GPIO pin: r0 holds the level the firmware is writing.
[[CPU.cpu0.plugins.world.pins]]
at = "world_gpio_write"
kind = "digital_out"
endpoint = "supply"
register = "r0"
low = 0.0
high = 3.3

# The analog input: the capacitor voltage is returned in r0 as millivolts.
[[CPU.cpu0.plugins.world.pins]]
at = "world_adc_read"
kind = "analog_in"
endpoint = "vcap"
register = "r0"
scale = 1000.0
