# PX4 FMUv6C ARM/NuttX bridge profile. See courbet/px4/fmu_v6c/README.md.
# Generic Cortex-M7 + ABI hooks; not a complete STM32H743 peripheral model.
# P2: VirtualIO.PwmInput -> ESC.AverageUnidirectional -> Motors.DynamicDCEquivalent -> QuadraticBlade + HubReaction -> common Multirotor.
# Electromechanical drive with inductance, load feedback and coast; parameters are illustrative.
# Current Rumoca FMI3 build limitations: third_party/courbet_deps/fire_modelica_models/docs/validation.md
# ==============================================================================
#                              Memory Configuration
# ==============================================================================
[Memory]

[Memory.main]
id = "px4_ram0"
base_address = "0x24000000"
memory_size = "512K"
memory_type = "SRAM"
backend = "ram"
share = false
prealloc = false

[[Memory.dtcm]]
id = "px4_ram1"
index = 1
base_address = "0x20000000"
memory_size = "128K"
memory_type = "SRAM"
backend = "ram"
share = false
prealloc = false

[[Memory.sram123]]
id = "px4_ram2"
index = 2
base_address = "0x30000000"
memory_size = "288K"
memory_type = "SRAM"
backend = "ram"
share = false
prealloc = false

[[Memory.sram4]]
id = "px4_ram3"
index = 3
base_address = "0x38000000"
memory_size = "64K"
memory_type = "SRAM"
backend = "ram"
share = false
prealloc = false

[[Memory.bkpram]]
id = "px4_ram4"
index = 4
base_address = "0x38800000"
memory_size = "4K"
memory_type = "SRAM"
backend = "ram"
share = false
prealloc = false

# ==============================================================================
#                                CPU Configuration
# ==============================================================================
[Machine]
platform = "STM32H743x"
# --- Debugging, Control, and Logging ---
# qemu_path = "../qemu/build/qemu-system-arm"  # optional: defaults to the QEMU FastDyn was built against
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 4444 # Used by the runtime helper watcher for graceful QEMU shutdown.
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "none"
icount = { shift = 5, sleep = false, align = false }
timer_irq_period_ns = 1000000 # 1 ms FMU/HRT service quantum. NuttX SysTick is separate.
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=false
finline='None'
print_command = false          #set to true if you want to print the final qemu on the terminal [Useful for debugging]

[CPU]
[[CPU.cpu0]]
# --- Core Emulation & Plugin Settings ---
arch = "arm"
machine = "cortexm"
cpu = "cortex-m7"
plugin_library = "build/libfastdyn.so"
binary = "virtuals/physics/flight_controllers/courbet/bin/px4_fmu-v6c_default.elf"
init_nsvtor = "0x08020000"
twintrace = "None" #options are record, replay or None
hardware_trace = 'hardware_log/io.log'   #useful in cases like replay to generate the replay binary
existing_config_path = "virtuals/physics/flight_controllers/courbet/px4/fmu_v6c/unlabeled_conf" #path to an existing config to use for this run. Useful for replaying with a different binary or for debugging.


# --- Embedded CPU Behavior Configurations ---
logger_content = """
# --- Plugin Logger Configuration ---
# level = DEBUG
# output = stderr
"""

# ==============================================================================
#                                FMU Configuration
# ==============================================================================

[FMU]
active = "quad_p2"
auto_build = true

[FMU.models.quad_p2]
model = "ConfiguredQuadP2"
model_file = "out/fire/quad_p2/ConfiguredQuadP2.mo"
source_roots = ["out/fire/quad_p2/sources"]
output = "out/fmi3/ConfiguredQuadP2"
compose = "third_party/courbet_deps/fire_modelica_models/configs/quad_p2.toml"
build = true
release = false

# ==============================================================================
#                             Runtime Helpers
# ==============================================================================

# Helper processes that should run alongside QEMU.
[Run]
cwd = "."
# Initialize PX4 modules when using fastdyn run directly (repository-relative).
# FASTDYN_BRIDGE_BOOT overrides this path; an empty value disables guest boot.
# Add --no-run-processes for console-only operation without host mission helpers.
bridge_boot = "virtuals/physics/flight_controllers/courbet/px4/fmu_v6c/boot.nsh"

[Run.profiling]
# Timing is low overhead and stays on for startup/mission phase measurement.
timing = true
timing_echo = true
# cProfile wraps Python helpers and writes .cprofile files under work-dir/profiles.
python = false
# perf wraps the QEMU process when the host permits it. Use "record" for flamegraphs.
perf = "off" # off | stat | record
perf_frequency_hz = 99
# FMU timing prints cumulative doStep and realtime-factor stats from the C backend.
fmu = true

# TELEM1 UART <-> host UDP <-> MAVProxy <-> mission helper / MAVCesium.
[Run.processes.mavproxy]
enabled = true
quiet = true
cwd = "virtuals/physics/flight_controllers/courbet/mavlink"
env = { PYTHONPATH = "." }
# Expand the session work directory in the child, after FastDyn supplies it.
command = [
    "sh", "-c", 'exec mavproxy.py --logfile="$FASTDYN_WORK_DIR/mav.tlog" "$@"', "px4-mavproxy",
    "--daemon",
    "--master=udpout:127.0.0.1:${FASTDYN_MAVLINK_FIRMWARE_PORT:-14551}",
    "--out=udpout:127.0.0.1:${FASTDYN_MAVLINK_GCS_PORT:-14552}",
    "--load-module=fastdyn_cesium:{\"port\":${FASTDYN_MAVCESIUM_PORT:-5000}}",
]
ready_message = "MAVCesium web viewer: open http://127.0.0.1:${FASTDYN_MAVCESIUM_PORT:-5000}/mavcesium/"

[Run.processes.mission]
enabled = true
start_delay_sec = 0
terminate_run_on_exit = true
command = [
    "python3",
    "virtuals/physics/flight_controllers/courbet/mavlink/mav_command_control_px4.py",
    "--connect",
    "udpin:127.0.0.1:${FASTDYN_MAVLINK_GCS_PORT:-14552}",
    "--monitor-sec",
    "180",
    "${FASTDYN_PARAM_FILE:-virtuals/physics/flight_controllers/courbet/mavlink/px4_init.param}",
    "${FASTDYN_MISSION_FILE:-virtuals/physics/flight_controllers/courbet/mavlink/copter_mission.waypoints}",
]
