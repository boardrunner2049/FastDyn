# ==============================================================================
#                               Rehosting Configuration
# ==============================================================================
[Rehosting]
[Rehosting.directories]
#Fastdyn will generate the static artifacts here.
static_analysis_cache_dir = "./fastdyn_static_analysis"
# Give the path of ardupilot source code (make sure to run `git submodule update --init` once you clone it.)
firmware_source_roots = ["../source_code_ardupilot/ardupilot"]
firmware_build_roots = ["../firmware_build_ardupilot/ardupilot"]
modeling_dir = "boardrunner/boardrunner_sdk/model"

# [Rehosting.milestones]
# targets = ["HAL_ChibiOS::run"]

#This will extract the macros (used in prompt generation) either from the firmware or the build path based on the availability.
[Rehosting.static_analysis.macros]
enabled = true
strategy = "auto"

# ==============================================================================
#                              Memory Configuration
# ==============================================================================
[Memory]

[Memory.main]   # required: goes to -machine ... memory-backend=<id>
id = "ram0"
base_address = "0x20000000"
memory_size  = "512M"
memory_type  = "SRAM"
backend      = "file"          # file | ram | memfd
memory_file  = "../qemu/ws/my_m4_ram3"
share        = true
prealloc     = false

[[Memory.ram1]]   # optional banks: go to -global cortexm-soc.ram_backendN / ram_baseaddrN
id = "ram1"
index = 1
base_address = "0x30000000"
memory_size  = "512K"
memory_type  = "SRAM"
backend      = "file"
memory_file  = "../qemu/ws/my_m4_ram"
share        = true
prealloc     = false

# ==============================================================================
#                                CPU Configuration
# ==============================================================================
[Machine]
platform = "STM32F427"
# --- Debugging, Control, and Logging ---
# qemu_path = "../qemu/build/qemu-system-arm"  # optional: defaults to the QEMU FastDyn was built against
enable_gdb = false
stop_on_start = false
launch_gdb = false
monitor_port = 5555
qmp_socket = "/tmp/qmp.sock"
log_file = "qemu.log"
log_options = "in_asm,op"
semihosting = true
semihosting_config = "enable=on,target=native"
coverage=false
finline='None'
print_command = true          #set to true if you want to print the final qemu on the terminal [Useful for debugging]
reset_memory_files = true     # clear file-backed RAM before QEMU starts to avoid stale SRAM across runs
ignore_functions = ["__idle_thread", "port_wait_for_interrupt"]

[CPU]
[[CPU.cpu0]]
# --- Core Emulation & Plugin Settings ---
arch = "arm"
machine = "cortexm"
cpu = "cortex-m4"
plugin_library = "build/libfastdyn.so"
monitor_elf = "../qemu/ws/monitor.elf" # The VMM-like monitor that runs with the target
binary = "virtuals/physics/flight_controllers/courbet/bin/ardurover_v462"

init_nsvtor = "0x08004000"
twintrace = "None" #options are record, replay or None
hardware_trace = 'hardware_log/io.log'   #useful in cases like replay to generate the replay binary
# existing_config_path = "virtuals/physics/flight_controllers/courbet/rover462/unlabeled_conf"
symbol_file = "virtuals/physics/flight_controllers/courbet/bin/ardurover_v462"
optifuzz = false

# --- Embedded CPU Behavior Configurations ---
logger_content = """
# --- Plugin Logger Configuration ---
# level = DEBUG
# output = stderr
"""

# ==============================================================================
#                              Device Configuration
# ==============================================================================

# --- Model-Specific Configurations ---
# Define the global arguments for each type of plugin device model here.

[Device.Models.elder]
    # The libhw backend is a global argument for the elder model.

[Device.Models.passthrough]
    backend = "stlink"

[Device.Models.classic]
    # The classic model has no global arguments.

[Device.Models.twintrace]
    backend = "stlink"
    # The classic model has no global arguments.

[Device.Models.unhandled]
    # This model explicitly marks memory as unhandled.

# --- Peripheral Definitions ---
# They will be populated automatically by the pipeline!
