schema = "scopt.pipeline"
version = 1
name = "sealed-whopr-7"
description = "Configuration 7: unbounded trusted helper graphs plus GCC-style WPA/LTRANS sealed firmware regions."
allowed_capabilities = ["INLINE_CALL", "EMIT_FIRMWARE_REGION"]

[[pass]]
name = "host-inline"
version = 1
params = { mode = "maximal", trusted_all_helpers = true, allow_partial = true }

[[pass]]
name = "firmware-inline"
version = 1
params = { mode = "exhaustive", trust = "user", interrupts = "disabled", icount = "ignored", planner = "whopr", partitions = 4, workers = 4 }
