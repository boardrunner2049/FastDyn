schema = "scopt.pipeline"
version = 1
name = "host-inline-extreme"
description = "Attempt fall-through inlining at every captured callsite and require full coverage."
allowed_capabilities = ["INLINE_CALL"]

[[pass]]
name = "host-inline-extreme"
version = 1

[pass.params]
max_callee_bytes = 1024
static_max_callee_bytes = 1024
max_sites = 4096
max_sites_per_unit = 256
max_growth_per_unit = 65536
max_total_growth = 65536
