schema = "scopt.pipeline"
version = 1
name = "O4-layout"
description = "O4-r3 with uncapped static chaining and profile-guided public layout composed with private firmware regions."
allowed_capabilities = ["INLINE_CALL", "EMIT_FIRMWARE_REGION", "CLONE", "REDIRECT_EXIT", "ADD_ENTRY", "ATTACH_FACT", "PURE_REWRITE", "ANNOTATE", "PIN", "LAYOUT_ORDER"]

[[pass]]
name = "host-inline"
version = 1
params = { mode = "maximal", trusted_all_helpers = true, trusted_rank_by = "frequency", trusted_selected_root = true, hot_loop_only = true, min_site_calls = 1000 }

[[pass]]
name = "specialize-returns"
version = 1
enabled = true
params = { targets_per_exit = 2, max_variants_per_c = 2, max_variants = 64, growth_fraction = 0.10 }

[[pass]]
name = "constant-propagation"
version = 1

[[pass]]
name = "branch-folding"
version = 1

[[pass]]
name = "dead-host-ops"
version = 1

[[pass]]
name = "chain-returns"
version = 1
enabled = true
params = { targets_per_exit = 2 }

[[pass]]
name = "chain-static"
version = 1
enabled = true
params = { targets_per_exit = 2, max_units = -1, rank_by_net_work = true, c_target_check = 0.0 }

[[pass]]
name = "hotcold-partition"
version = 1
params = { phase = "steady", coverage = 0.99 }

[[pass]]
name = "cluster-hot"
version = 1
params = { phase = "steady", kinds = ["chain0", "chain1", "lookup_hit"] }

[[pass]]
name = "order-cold"
version = 1
params = { hot_fallback = true }

[[pass]]
name = "firmware-inline"
version = 1
params = { mode = "exhaustive", cost_model = "profile", phase = "steady", trust = "user", interrupts = "disabled", icount = "ignored", planner = "whopr", partitions = 4, workers = 4, member_slot_skip = "on" }
