schema = "scopt.pipeline"
version = 1
name = "b3-ph"
description = "B3 specialization and chaining, then Pettis-Hansen placement using final body sizes."
allowed_capabilities = ["CLONE", "REDIRECT_EXIT", "ADD_ENTRY", "ATTACH_FACT", "PURE_REWRITE", "ANNOTATE", "PIN", "LAYOUT_ORDER"]

[[pass]]
name = "specialize-returns"
version = 1
params = { targets_per_exit = 2, max_variants_per_c = 2, max_variants = 64, growth_fraction = 0.10 }

[[pass]]
name = "constant-propagation"
version = 1

[[pass]]
name = "branch-folding"
version = 1

[[pass]]
name = "dead-host-ops"
version = 1

[[pass]]
name = "chain-returns"
version = 1
params = { targets_per_exit = 2 }

[[pass]]
name = "chain-static"
version = 1
params = { targets_per_exit = 2 }

[[pass]]
name = "hotcold-partition"
version = 1
params = { phase = "steady", coverage = 0.99 }

[[pass]]
name = "cluster-hot"
version = 1
params = { phase = "steady", kinds = ["chain0", "chain1", "lookup_hit"] }

[[pass]]
name = "order-cold"
version = 1
params = { hot_fallback = true }
