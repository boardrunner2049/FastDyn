# ---------------------------------------------------------------------------------------
# Arms of design §10.1 that cannot be built today: rows `skipped_unsupported` in every
# report (scopt report shows them; they are never silently dropped).
# ---------------------------------------------------------------------------------------

[[skipped_unsupported]]
name = "semantic"
reason = "capability_not_enabled"
detail = "b3-chain + b3-static + b3-spec + b4 in ONE artifact needs a B3+B4 packager: scopt.manager_b3.optimize_b3 builds hostsym inputs with build_contract and no need_d2/need_d3, while B4 deletions are only certified by eliminate_state_sync.package_b4 (StrictCallContract, need_d2/need_d3, V15 deletable class). No WP owns that composition yet. The B3 part is timed as `b3`, the B4 part as `b4`."

[[skipped_unsupported]]
name = "combined"
reason = "capability_not_enabled"
detail = "semantic + layout: needs `semantic`, and scopt.manager_b3.optimize_b3 refuses a pipeline with both B2 layout edits and B3/B4 edits (ValueError 'combined arm: v2', WP21 note item 15)."

[[skipped_unsupported]]
name = "semantic-no-<pass>"
expand = ["chain-returns", "chain-static", "specialize-returns", "constant-propagation", "branch-folding", "dead-host-ops", "eliminate-state-sync"]
reason = "capability_not_enabled"
detail = "parent `semantic` is skipped_unsupported. Substitute: b3-no-<pass> on top of `b3` (the six B3 passes) and b4-D1/D2/D3 on top of `b4`."

# Built or known arms that are NOT timed (reported as excluded rows, with the reason).
[[excluded]]
name = "layout-no-hotcold-partition"
reason = "degenerate (WP11, docs/b2-layout.md): both layout passes skip with missing_hotness and the candidate is the input layout (0 moved), byte-identical to warm/identity"

[[excluded]]
name = "cmov"
reason = "experimental_cmov_crosses_insn (WP16): the if-converted window crosses a guest-insn boundary that V15 refuses; never published, so never a campaign arm"

[[excluded]]
name = "gce / d1 / lk2x / gce-fail / sfb-ctl (WP16 copies)"
reason = "experimental v5 copies labelled experimental_* on the qint binary, never published; superseded by the validated v6 b3-chain/b3-static arms and the published b4/sfb artifacts"

[[excluded]]
name = "blinky"
reason = "no gate-binary blinky base or B3/B4 artifact exists, and its window is ~99.96 % idle loop (B2 informational only); not re-collected"

[excluded_rule]
duplicate = "an arm whose cache.sc sparse sha256 equals an earlier arm's (in file order) is excluded at freeze as degenerate (it would time the same bytes twice), with the arm it duplicates; an arm with aa_control = true that equals warm is kept (A/A control) and marked sha256_equals_warm"

# ---------------------------------------------------------------------------------------
# Sets: train (calibration and model check only), heldout and final (the reported rows).
# Each set: interleaved, paired, seeded schedule (scopt.run.arms.make_schedule): per rep
# the input order is shuffled and per (rep, input) the arm order; >= 30 reps x 3 inputs.
# Sets run in file order. The final split runs last and only after `check` passes again.
# ---------------------------------------------------------------------------------------

[schedule]
min_reps = 30
timeout_s = 300.0
order = "sets in file order; within a set per repetition the inputs are shuffled and per (rep, input) the arms are shuffled with random.Random(seed); the schedule is in campaign.json before the first run"
core_arms = ["nocache", "empty", "warm", "identity", "identity-v6", "layout", "b3-chain", "b3-static", "b3-spec", "b3", "b4", "sfb", "sfb-b4"]
ablation_arms = ["warm", "layout", "layout-no-cluster-hot", "layout-no-order-cold", "b3", "b3-no-specialize-returns", "b3-no-constant-propagation", "b3-no-branch-folding", "b3-no-dead-host-ops", "b3-no-chain-returns", "b3-no-chain-static", "b4", "b4-D1", "b4-D2", "b4-D3"]
calibration_arms = ["warm", "b3-chain", "b3-static", "b3-spec", "b3", "b4", "sfb"]

[[set]]
name = "compute-train-calib"
split = "train"
input_set = "/data/extra_copy/fastdyn/fixtures/inputs/train/freertos-mps2-compute"
arms = "calibration_arms"
reps = 30
seed = 3001
purpose = "re-derive c_lookup-type savings per removed lookup / store on the gate binary against the train-profile MODEL (D-EV-2). Never a headline speedup."

[[set]]
name = "compute-heldout-core"
split = "heldout"
input_set = "/data/extra_copy/fastdyn/fixtures/inputs/heldout/freertos-mps2-compute"
arms = "core_arms"
reps = 30
seed = 3002

[[set]]
name = "compute-heldout-ablation"
split = "heldout"
input_set = "/data/extra_copy/fastdyn/fixtures/inputs/heldout/freertos-mps2-compute"
arms = "ablation_arms"
reps = 30
seed = 3003

[[set]]
name = "compute-final-core"
split = "final"
input_set = "/data/extra_copy/fastdyn/fixtures/inputs/final/freertos-mps2-compute"
arms = "core_arms"
reps = 30
seed = 3004

[[set]]
name = "compute-final-ablation"
split = "final"
input_set = "/data/extra_copy/fastdyn/fixtures/inputs/final/freertos-mps2-compute"
arms = "ablation_arms"
reps = 30
seed = 3005

# Untimed diagnostics after the timing sets (never under the timing lock, never timed):
[diag]
base_profiles = ["heldout", "final"]
base_profile_note = "steady-phase profile of the BASE snapshot on the held-out and final inputs (evaluation only, never training; design 10.2): the removed-lookup/store MODEL re-computed per split"
v6_stats_arms = ["identity-v6", "b3-chain", "b3-static", "b3-spec", "b3"]
v6_stats_splits = ["heldout", "final"]
v6_stats_note = "one untimed run per (v6 arm, input) with QEMU_SC_V6_STATS through scopt validate --dynamic --oracles O1,O3,O5 against warm: links armed, disarm_*, refused, ext_load_ns, appended; C' entries of every SPEC variant by gdb -nx hardware breakpoints"

[timing]
lock = "/data/extra_copy/fastdyn/runs/.timing.lock"
cores = 4
cpu_list_default = "8-11"
load_sample_s = 30
note = "run holds flock on the host-wide lock for the whole job, pins scopt run to 4 cores with taskset, samples /proc/loadavg every 30 s and records the CPU budget and load averages in b5_campaign.json"

[rules]
min_valid_pairs = 30
R1_freeze = "b5_campaign.py check passes before the first set, before the first final set and after the last set; every scopt run campaign.json has status done and freeze_ok true"
R2_samples = "every timed arm of every set has >= 30 valid paired samples with warm"
R3_correctness = "no output_mismatch against warm of the same (rep, input) pair"
R4_qemu = "every valid sample ran the frozen gate binary sha256 (no mixed_qemu)"
R5_reported = "scopt report rendered per set and combined, with the B5 section (every metric row of design 10.2, skipped_unsupported and excluded rows included)"
R6_lock = "the timing job held the host-wide timing lock, used <= 4 cores and recorded load averages"
verdict = "B5 = measured_and_reported when R1-R6 hold, else incomplete (listing the failed rules). The speedup is not a pass criterion: per comparison faster / slower / no_significant_difference (95 % CI excludes 1 or not); R11 flag = median >= 1.0 % and CI excludes 0. Null and negative results are reported plainly. No retuning after looking at held-out or final results."
