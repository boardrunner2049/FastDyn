# B5 campaign DEFINITION (WP30; design/B3-B4-design.md §10, plan WP30). Hand-written.
#
# This file says WHAT the B5 campaign times and HOW each arm is obtained. It holds no
# sha256. `tests/qemu/b5_campaign.py prep` builds or collects every arm on the frozen gate
# binary, `freeze` resolves this file into the frozen campaign `campaigns/b5-freertos.toml`
# (every sha256: gate binary, plugin, firmware, base TOML, snapshot, training profile, every
# arm's cache.sc / MANIFEST / artifact id, every input and split manifest, the code ids),
# and `check` is the freeze checker. WP30 defines the campaign; it times nothing.
#
# Priorities (reports/WP16-probe.md, R11 decision; WP28/WP29 reported rows):
#   1. lookup removal (b3-static, b3-chain, b3) -- WP16 gce +6.9 %, WP28 held-out b3 +6.3 %;
#   2. the baseline-TCG entry fix (sfb) -- the largest effect, its own arm, NEVER counted as
#      caching, B3 or B4;
#   3. b3-spec (CP/BF/DHO on 4 variants: model 0.8 % of lookups; WP28 null) and B4
#      (D1/D2/D3: WP16 d1 null, WP29 null) -- null-expected arms, reported plainly;
#   4. ablations (per pass / per class / layout) -- second set per split.
schema = "scopt.b5_definition/1"
name = "b5-freertos"
design = "design/B3-B4-design.md section 10 (arms 10.1, metrics 10.2, profitability 10.3), section 11 (B3/B4 performance rows); IMPLEMENTATION-PLAN-B3B4.md WP30"
frozen_campaign = "b5-freertos.toml"

[runtime]
gate_binary_record = "/data/extra_copy/fastdyn/runs/wp22/gate-binary.json"
plugin = "/data/extra_copy/fastdyn/src/fastdyn/build/libfastdyn.so"
launch = "setarch x86_64 -R, timeout, fresh run dir per run (own cache, work, RAM), supercache_flat = false, RAM reset per run"
rule = "Every arm, the warm reference and every baseline run on the frozen gate binary qint-v6-gate-1 (plan R13, design D-EV-2). A later commit to qint-v6 voids the freeze."

[workload]
name = "compute"
note = "FreeRTOS MPS2 CM3 compute fixture, icount shift=0, BENCH window = vComputeWindowStart..End. The only workload with input splits and B3/B4 artifacts on the gate binary."
base_from = "/data/extra_copy/fastdyn/runs/wp28/compute.json"
base_note = "The gate-binary compute base of WP28 (scopt prepare on train-1..3, import, admission identity v2, steady@0x2990 profile on train-1..3). WP29's base has the same snapshot id and byte-identical cache.sc and TOML (checked at freeze)."
phase = "steady@0x2990"
calibration = "/data/extra_copy/fastdyn/runs/b3-explore/wp16/calibration.json"
calibration_note = "WP16 constants were measured on the qint binary. They feed the MODEL rows only (labelled qint). The train set re-derives the per-lookup and per-store savings on the gate binary (D-EV-2) from measured differences."

# ---------------------------------------------------------------------------------------
# Arms. kind: nocache | empty | deploy. source: how prep obtains the artifact:
#   warm               the base snapshot directory
#   reuse:<file>#<key> a published artifact recorded by an earlier gate WP (JSON path)
#   build:<recipe>     built by b5_campaign.py prep on the gate-binary base
# category: baseline | reference | control | b2 | b3 | b4 | baseline_tcg_fix
# ---------------------------------------------------------------------------------------

[[arm]]
name = "nocache"
kind = "nocache"
role = "baseline"
category = "baseline"
note = "base TOML with [Machine].supercache commented out (derived by scopt run)"

[[arm]]
name = "empty"
kind = "empty"
role = "baseline"
category = "baseline"
note = "cold run in a fresh run dir, nothing deployed"

[[arm]]
name = "warm"
kind = "deploy"
role = "reference"
category = "reference"
source = "warm"
note = "primary reference: the unoptimized gate-binary cache every candidate was optimized from"

[[arm]]
name = "identity"
kind = "deploy"
role = "candidate"
category = "control"
source = "build:identity"
aa_control = true
note = "identity pipeline, v5 file: its cache.sc is byte-identical to warm (V9), so it is the A/A control of the deploy path and measures the noise floor; exempt from the duplicate rule"

[[arm]]
name = "identity-v6"
kind = "deploy"
role = "candidate"
category = "control"
source = "build:identity-v6"
note = "the same code as v6 with an empty extension table: v6 loader overhead (ext parse, activation)"

[[arm]]
name = "layout"
kind = "deploy"
role = "candidate"
category = "b2"
source = "build:b2-layout"
note = "B2 pipeline re-run on the gate-binary base (B2 was null on qint; re-collected per D-EV-2)"

[[arm]]
name = "b3-chain"
kind = "deploy"
role = "candidate"
category = "b3"
priority = 1
source = "reuse:/data/extra_copy/fastdyn/runs/wp28/compute.json#arms.b3-chain.publish.artifact_dir"
v10 = "/data/extra_copy/fastdyn/runs/wp28/compute.json#arms.b3-chain.v10.verdict"
note = "chain-returns only (GENERAL guarded slots on return exits)"

[[arm]]
name = "b3-static"
kind = "deploy"
role = "candidate"
category = "b3"
priority = 1
source = "reuse:/data/extra_copy/fastdyn/runs/wp28/compute.json#arms.b3-static.publish.artifact_dir"
v10 = "/data/extra_copy/fastdyn/runs/wp28/compute.json#arms.b3-static.v10.verdict"
note = "chain-static only (beyond the spec's return scope; reported separately)"

[[arm]]
name = "b3-spec"
kind = "deploy"
role = "candidate"
category = "b3"
priority = 3
source = "reuse:/data/extra_copy/fastdyn/runs/wp28/compute.json#arms.b3-spec.publish.artifact_dir"
v10 = "/data/extra_copy/fastdyn/runs/wp28/compute.json#arms.b3-spec.v10.verdict"
note = "specialize-returns + CP + BF + DHO (semantic cross-TB; 4 SPEC variants on compute)"

[[arm]]
name = "b3"
kind = "deploy"
role = "candidate"
category = "b3"
priority = 1
source = "reuse:/data/extra_copy/fastdyn/runs/wp28/compute.json#arms.b3.publish.artifact_dir"
v10 = "/data/extra_copy/fastdyn/runs/wp28/compute.json#arms.b3.v10.verdict"
note = "all six B3 passes = the B3 part of `semantic` (semantic itself is skipped_unsupported, see below); parent of the b3-no-<pass> ablations"

[[arm]]
name = "b4"
kind = "deploy"
role = "candidate"
category = "b4"
priority = 3
source = "reuse:/data/extra_copy/fastdyn/runs/wp29/compute/package.json#rows[label=b4].artifact_dir"
v10 = "/data/extra_copy/fastdyn/runs/wp29/compute-v10.json#rows[label=b4].verdict"
note = "eliminate-state-sync D1|D2|D3 (v5 file); parent of the per-class ablations"

[[arm]]
name = "sfb"
kind = "deploy"
role = "candidate"
category = "baseline_tcg_fix"
priority = 2
source = "reuse:/data/extra_copy/fastdyn/runs/wp29/compute/package.json#rows[label=sfb].artifact_dir"
v10 = "/data/extra_copy/fastdyn/runs/wp29/compute-v10.json#rows[label=sfb].verdict"
note = "icount-entry store-forwarding fix: a BASELINE-TCG fix (survey section 3c B4-1). Its own arm; never counted as caching, B3 or B4 (spec section 8)"

[[arm]]
name = "sfb-b4"
kind = "deploy"
role = "candidate"
category = "b4"
priority = 3
parent = "sfb"
source = "reuse:/data/extra_copy/fastdyn/runs/wp29/compute/package.json#rows[label=sfb+b4].artifact_dir"
v10 = "/data/extra_copy/fastdyn/runs/wp29/compute-v10.json#rows[label=sfb+b4].verdict"
note = "B4 layered on the entry fix (survey: B4 after SFB); compared with sfb (its parent) and with warm. The B4 share is sfb-b4 vs sfb only"

