# Experiment arm o4r2b (not shipped): the build copy of O4-r2b.toml (P6, O4-design 3.8 B1
# retry).  Same [[pass]] entries and allowed_capabilities as O4-r2b.toml; only the name, the
# description and this header differ.  Written by /data/scfix-o4/p6/make_r2b.py.
schema = "scopt.pipeline"
version = 1
name = "o4r2b"
description = "arm o4r2b: the build copy of O4-r2b.toml (same passes and capabilities)"
allowed_capabilities = ["EMIT_FIRMWARE_REGION", "CLONE", "REDIRECT_EXIT", "ADD_ENTRY", "ATTACH_FACT", "PURE_REWRITE"]

[[pass]]
name = "chain-returns"
version = 1
enabled = true
params = { targets_per_exit = 2 }

[[pass]]
name = "chain-static"
version = 1
enabled = true
params = { targets_per_exit = 2 }

[[pass]]
name = "firmware-inline"
version = 1
params = { mode = "hot-loop", phase = "steady", min_call_count = 1000, isb_boundary = true, trust = "user", interrupts = "disabled", icount = "ignored", planner = "whopr", partitions = 4, workers = 4, member_slot_skip = "on" }
